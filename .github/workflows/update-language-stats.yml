name: Update language stats

on:
  schedule:
    - cron: "0 11,18 * * *"   # todos os dias às 08:00 e 15:00 de Brasília (UTC-3)
  workflow_dispatch: {}       # permite rodar manualmente pelo GitHub

permissions:
  contents: write

# Evita duas execuções ao mesmo tempo disputando o push do SVG.
concurrency:
  group: update-language-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run language stats script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # GH_USER: seu-usuario   # opcional, descomente se necessário
        run: python language_stats.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "168676931+brunosiqp@users.noreply.github.com"
          git config --local user.name "brunosiqp"
          git add language-stats.svg
          git diff --quiet --cached || git commit -m "chore: atualiza estatísticas de linguagens"
          git pull --rebase
          git push
