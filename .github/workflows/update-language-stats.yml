name: Update language stats

on:
  schedule:
    # Every day at 07:37 Brasília time (10:37 UTC). GitHub queues scheduled runs, often
    # by tens of minutes and worse at the top of the hour, so starting off the hour
    # makes the card ready around 08:00.
    - cron: "37 10 * * *"
  workflow_dispatch: {}       # allows manual runs from GitHub

permissions:
  contents: write

# Prevents two runs from racing to push the SVG.
concurrency:
  group: update-language-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run language stats script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # GH_USER: your-user   # optional, uncomment if needed
        run: python language_stats.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "168676931+brunosiqp@users.noreply.github.com"
          git config --local user.name "brunosiqp"
          git add language-stats.svg
          git diff --quiet --cached || git commit -m "chore: update language stats"
          git pull --rebase
          git push
